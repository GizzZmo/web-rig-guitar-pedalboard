name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f vercel.json
          test -d assets

      - name: Validate pedalboard HTML
        run: node scripts/validate.mjs

      - name: Package site assets
        run: |
          mkdir -p dist
          cp index.html vercel.json LICENSE README.md dist/
          cp -R assets dist/assets
          tar -czf web-rig-assets.tar.gz -C dist .
          echo "packed=$(find dist -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            index.html
            vercel.json
            LICENSE
            assets/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            dist/**
            web-rig-assets.tar.gz
          if-no-files-found: error
          retention-days: 14

  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-fund --no-audit playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/screenshot.mjs

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots/**
          if-no-files-found: error
          retention-days: 30

      - name: Screenshot summary
        run: |
          {
            echo "## Screenshots"
            echo
            ls -la artifacts/screenshots
            echo
            echo "Download the **screenshots** artifact from this run."
          } >> "$GITHUB_STEP_SUMMARY"
